name: el-bebe
services:
  app:
    image: el-bebe:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        SITE_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      EMDASH_SITE_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      EL_BEBE_TRUST_LOCAL_PROXY: 'true'
      EL_BEBE_TRUSTED_PROXY_IPS: ${DOCKER_PROXY_IP:-172.30.42.2}
    secrets:
      - emdash_encryption_key
    volumes:
      - site_data:/var/lib/el-bebe
    networks:
      backend:
        ipv4_address: ${DOCKER_APP_IP:-172.30.42.3}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: ${DOCKER_PROXY_IP:-172.30.42.2}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  backend:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.42.0/24}
volumes:
  site_data:
    name: ${DATA_VOLUME:-el-bebe_site_data}
  caddy_data:
  caddy_config:
secrets:
  emdash_encryption_key:
    file: ./deploy/secrets/emdash-encryption-key
